# KnifeAngle: основная прошивка (этап 1).

# --- BLE: периферия, одно соединение, без сопряжения ---
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="KnifeAngle"
CONFIG_BT_MAX_CONN=1
CONFIG_BT_SMP=n
CONFIG_BT_BAS=y
# Без сопряжения шифрование и приватность в контроллере не нужны (минус ~10 КБ flash).
CONFIG_BT_CTLR_LE_ENC=n
CONFIG_BT_CTLR_PRIVACY=n

# Параметры соединения, которые устройство запрашивает через 5 с после подключения.
# Интервал 180–200 мс (единицы 1.25 мс): ровно под notify раз в 200 мс, и меньше
# пробуждений радио. Задержка 0, таймаут 4 с.
# Укладывается в требования Apple: min+15 мс ≤ max, max·(lat+1)·3 < timeout.
CONFIG_BT_GAP_AUTO_UPDATE_CONN_PARAMS=y
CONFIG_BT_GAP_PERIPHERAL_PREF_PARAMS=y
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=144
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=160
CONFIG_BT_PERIPHERAL_PREF_LATENCY=0
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=400

# --- Периферия чипа ---
CONFIG_SPI=y
# Драйвер Zephyr для LIS2DH не нужен: регистры читаются напрямую (accel.c).
CONFIG_LIS2DH=n
CONFIG_ADC=y
CONFIG_WATCHDOG=y
CONFIG_POWEROFF=y

# --- Хранение калибровки: NVS в разделе storage_partition (8 КБ) ---
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y

# --- Прочее ---
CONFIG_LOG=n
CONFIG_ASSERT=n
CONFIG_MAIN_STACK_SIZE=2048
